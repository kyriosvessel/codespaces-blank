name: Easy $ Funding Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4
        with:
          ref: codespace-effective-space-palm-tree-p799qvr9j4rg29w55

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks

      - name: Align and sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release-key.jks --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Easy-Funding-release.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify Easy-Funding-release.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Funding-Release-APK
          path: Easy-Funding-release.apk
